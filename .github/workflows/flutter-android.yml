name: Build Flutter Android APK

on:
  push:
    tags: 
      - 'v*'
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'

      - name: Flutter pub get
        run: flutter pub get

      # Best effort: the hosted image already ships the Android SDK, and Gradle downloads
      # whatever else it needs. A failure here must not stop the build.
      - name: Install Android packages (best effort)
        continue-on-error: true
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "build-tools;34.0.0" "platforms;android-34" "ndk;27.0.12077973" "cmake;3.22.1" || true

      - name: Prepare signing keystore (optional)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$SIGNING_KEYSTORE_BASE64" ]]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          else
            echo "::warning::No signing secrets found. The APK will use a throwaway debug key and cannot be installed as an update over a previous build."
          fi

      # --build-number must increase with every build, or Android refuses the update.
      - name: Build APK
        env:
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          # On a v* tag, the tag becomes the app's version name (v1.2.4 -> 1.2.4).
          EXTRA=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            EXTRA="--build-name=${GITHUB_REF_NAME#v}"
          fi
          flutter build apk --release --split-per-abi --build-number=$((GITHUB_RUN_NUMBER + 100)) $EXTRA 2>&1 | tee build.log

      # Prints compile errors as annotations so they show on the run summary page.
      - name: Show build errors
        if: failure()
        run: |
          grep -E "(Error|error):" build.log | head -20 | while IFS= read -r line; do echo "::error::${line}"; done || true
 
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/*

      # Only runs for tag pushes like v1.2.0 (not on every push to main).
      - name: Push to Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/*.apk"
          tag: ${{ github.ref_name }}
          allowUpdates: true
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
