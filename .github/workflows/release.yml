name: Release APK

# Run it from the Actions tab: type the version (like 1.3.4, no "v"), and it builds the
# APK and publishes a GitHub Release tagged v<version>.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version, e.g. 1.3.4 (no leading v)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'

      - name: Flutter pub get
        run: flutter pub get

      - name: Prepare signing keystore (optional)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$SIGNING_KEYSTORE_BASE64" ]]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          else
            echo "::warning::No signing secrets found. The APK will use a throwaway debug key and cannot update an installed build."
          fi

      - name: Build APK
        env:
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi --build-name=${{ inputs.version }} --build-number=$((GITHUB_RUN_NUMBER + 100)) 2>&1 | tee build.log

      # Prints compile errors as annotations so they show on the run summary page.
      - name: Show build errors
        if: failure()
        run: |
          grep -E "(Error|error):" build.log | head -20 | while IFS= read -r line; do echo "::error::${line}"; done || true

      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/*.apk"
          tag: v${{ inputs.version }}
          commit: ${{ github.sha }}
          name: HackLyr v${{ inputs.version }}
          allowUpdates: true
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
